[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-agent-reliability-skills"
version = "0.1.0"
description = "Generate a pre-coding reliability skill for an agent repository with Trustabl Forge, from a Pydantic AI agent."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Trustabl" }]
keywords = ["pydantic-ai", "agent", "skills", "reliability", "claude-code", "trustabl", "forge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pydantic-ai-slim>=2.0", "pydantic>=2.0"]

[project.urls]
Homepage = "https://github.com/trustabl/pydantic-ai-agent-reliability-skills"
Source = "https://github.com/trustabl/pydantic-ai-agent-reliability-skills"
Issues = "https://github.com/trustabl/pydantic-ai-agent-reliability-skills/issues"

# The analyzer release this package runs `trustabl forge` from. Separate from
# the package version because the two change for different reasons: a packaging
# fix must not imply a new engine, and an engine bump must not imply new code.
[tool.trustabl]
engine-version = "0.1.15"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_ai_agent_reliability_skills"]

[tool.pytest.ini_options]
testpaths = ["tests"]
